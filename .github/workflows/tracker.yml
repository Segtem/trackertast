name: tracker

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tracker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # La historia entera para comprobación de commits y seguimiento
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install "setuptools>=68"
      - run: python -m pip install -e ".[prueba]"
      - name: Suite de pruebas
        run: python -m unittest discover -s tests -t .
      - name: Verificar páginas del sitio
        run: python tools/sitio.py
      - name: Verificar guía
        run: python tools/guia.py
      - name: Verificar CLI
        run: tasks --help
      - name: Juzgar ejemplo de seguimiento
        run: oracle test --proyecto ejemplo/seguimiento-tareas
