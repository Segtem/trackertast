[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oracle-task"
dynamic = ["version"]
description = "Tracker local de tareas en archivos Markdown dentro del repositorio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Segtem" }
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Segtem/trackertast"
Repository = "https://github.com/Segtem/trackertast"

[project.scripts]
oracle-task = "oracle_task.cli:main"
tasks = "oracle_task.cli:main"

[project.optional-dependencies]
prueba = [
    "oracle-metalenguaje==0.38.1"
]

[tool.setuptools.dynamic]
version = { attr = "oracle_task.__version__" }

[tool.setuptools.packages.find]
include = ["oracle_task*"]
